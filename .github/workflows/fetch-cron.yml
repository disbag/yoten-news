name: Fetch news

on:
  schedule:
    # Cron у GitHub Actions всегда в UTC, МСК = UTC+3.
    # День (07:00–22:00 МСК = 04:00–19:00 UTC) — раз в час.
    - cron: "0 4-19 * * *"
    # Ночь (23:00, 02:00, 05:00 МСК = 20:00, 23:00, 02:00 UTC) — раз в 3 часа.
    - cron: "0 20,23,2 * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch-cron
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache
          key: xenova-all-MiniLM-L6-v2

      - run: npm ci

      - run: npm run fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RETENTION_DAYS: ${{ secrets.RETENTION_DAYS }}
          DEDUPE_THRESHOLD: ${{ secrets.DEDUPE_THRESHOLD }}
