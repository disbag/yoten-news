name: Fetch news

on:
  # Основной запуск — внешний: cron-job.org каждые 30 минут (в :00 и :30)
  # дёргает workflow_dispatch через API GitHub. Расписание ниже — запасное, на
  # случай сбоя cron-job.org; днём оно добавляет лишний прогон раз в час,
  # который просто встаёт в очередь за основным (concurrency ниже) и почти
  # ничего нового не находит. GitHub запускает такие прогоны с опозданием
  # минут на 20 (14.10.2026: "7 …" срабатывал в :27).
  schedule:
    # Cron у GitHub Actions всегда в UTC, МСК = UTC+3.
    # Минута 7, а не 0 — запуски ровно в начале часа попадают в пик нагрузки
    # по всему GitHub и заметно задерживаются (см. доку GitHub Actions).
    # День (07:00–22:00 МСК = 04:00–19:00 UTC) — раз в час.
    - cron: "7 4-19 * * *"
    # Ночь (23:00, 02:00, 05:00 МСК = 20:00, 23:00, 02:00 UTC) — раз в 3 часа.
    - cron: "7 20,23,2 * * *"
  workflow_dispatch: {}

concurrency:
  group: fetch-cron
  cancel-in-progress: false

# actions: read — отчёт о состоянии (шаг в конце) читает прогоны и их логи.
permissions:
  actions: read
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: .cache
          key: xenova-all-MiniLM-L6-v2

      # Последняя сработавшая комбинация ключ+модель Gemini (STATE_PATH в
      # src/lib/gemini.ts) — переносим между прогонами, иначе каждый прогон
      # начинал перебор с ключа #1 и, когда его суточная квота кончалась
      # (к ночи по UTC), первым делом ловил 429. Ключ кеша уникален для
      # прогона, чтобы каждый прогон сохранял свежее состояние, а
      # restore-keys подтягивает самое последнее сохранённое.
      - name: Cache Gemini key state
        uses: actions/cache@v6
        with:
          path: .gemini-state.json
          key: gemini-state-${{ github.run_id }}
          restore-keys: gemini-state-

      - run: npm ci
        env:
          # onnxruntime-node (его тянет @huggingface/transformers) на Linux при
          # установке скачивает с NuGet пакет Microsoft.ML.OnnxRuntime.Gpu.Linux
          # (236 МБ) ради библиотек для видеокарт NVIDIA (CUDA, TensorRT). Нам
          # они не нужны: эмбеддинги считаются на процессоре, его библиотека
          # уже лежит в самом npm-пакете. Без этой настройки — 236 МБ на каждый
          # прогон, и 16.10.2026 прогон упал, когда скачивание оборвалось.
          ONNXRUNTIME_NODE_INSTALL: skip

      - run: npm run fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Не секреты (просто числа конфигурации) — в vars, а не secrets,
          # иначе GitHub маскирует в логах ЛЮБОЕ совпадение с этим значением
          # (напр. RETENTION_DAYS=7 маскировал цифру "7" внутри номеров
          # кластеров вроде #1927 → "192***").
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
          DEDUPE_THRESHOLD: ${{ vars.DEDUPE_THRESHOLD }}

      # Ежедневный отчёт о состоянии в Telegram (DIS-81, src/jobs/healthReport.ts).
      # Своё расписание GitHub ненадёжно — 28 октября запуск в 07:00 UTC он
      # просто пропустил, — поэтому отчёт отправляет первый прогон сбора после
      # 10:00 МСК (07:00 UTC), а сбор надёжно запускает cron-job.org. Метка в
      # кэше на дату не даёт отправить второй раз; не получилось — отправит
      # следующий прогон, до 13:00 МСК. Отчёт — и после неудачного сбора.
      - name: Health report due?
        id: health
        if: always()
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          hour=$(date -u +%H)
          if [ "$hour" -ge 7 ] && [ "$hour" -lt 10 ]; then echo "due=true" >> "$GITHUB_OUTPUT"; fi

      - name: Health report already sent today?
        id: sent
        if: always() && steps.health.outputs.due == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .health-report-sent
          key: health-report-${{ steps.health.outputs.date }}
          lookup-only: true

      - name: Health report
        if: always() && steps.health.outputs.due == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: npm run health && date -u > .health-report-sent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Remember the report was sent
        if: always() && hashFiles('.health-report-sent') != ''
        uses: actions/cache/save@v6
        with:
          path: .health-report-sent
          key: health-report-${{ steps.health.outputs.date }}
