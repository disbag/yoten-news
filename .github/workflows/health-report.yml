name: Health report

# Ежедневный отчёт о состоянии ленты в Telegram (DIS-81, src/jobs/healthReport.ts).
# 07:00 UTC = 10:00 по Москве. workflow_dispatch — ручной запуск.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - run: npm run health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
